services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - mailhog

  frontend:
    build:
      context: ../frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
